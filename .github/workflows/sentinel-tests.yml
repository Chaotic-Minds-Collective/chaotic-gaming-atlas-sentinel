name: CG Sentinel tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/sentinel-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/sentinel-tests.yml"

permissions:
  contents: read

concurrency:
  group: sentinel-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
